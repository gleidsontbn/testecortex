<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instalações em Tempo Real</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section id="login-screen" class="card visible">
        <h1>Controle de Instalações</h1>
        <p>Faça login para acompanhar equipes, mapa e status ao vivo.</p>
        <form id="login-form" class="form-grid">
          <label>
            Usuário
            <input type="text" id="username" placeholder="admin" required />
          </label>
          <label>
            Senha
            <input type="password" id="password" placeholder="1234" required />
          </label>
          <button type="submit">Entrar</button>
        </form>
        <small class="hint">Credenciais demo: <strong>admin / 1234</strong></small>
        <p id="login-error" class="error"></p>
      </section>

      <section id="dashboard" class="hidden">
        <header class="topbar">
          <div>
            <h2>Painel Operacional</h2>
            <p id="last-update">Última atualização: --</p>
          </div>
          <button id="logout">Sair</button>
        </header>

        <section class="metrics">
          <article class="metric-card">
            <span>Concluídas</span>
            <strong id="done-count">0</strong>
          </article>
          <article class="metric-card">
            <span>Em andamento</span>
            <strong id="progress-count">0</strong>
          </article>
          <article class="metric-card">
            <span>Pendentes</span>
            <strong id="pending-count">0</strong>
          </article>
        </section>

        <section class="layout">
          <article class="card map-card">
            <h3>Mapa de instalações</h3>
            <div id="map"></div>
          </article>

          <article class="card list-card">
            <h3>Status em tempo real</h3>
            <ul id="installation-list"></ul>
          </article>
        </section>
      </section>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="app.js"></script>
  </body>
</html>
